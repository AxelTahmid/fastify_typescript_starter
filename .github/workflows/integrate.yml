name: "Integrate"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: starter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d starter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PG_CONNECTION_STRING: postgres://ci:ci@localhost:5432/starter_ci
      SEED_ADMIN_PASSWORD: ci-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate JWT test keys
        run: |
          openssl ecparam -genkey -name prime256v1 -noout -out jwt-pvt.pem
          openssl ec -in jwt-pvt.pem -pubout -out jwt-pub.pem
          echo "JWT_PRIVATE_KEY=$(openssl base64 -A -in jwt-pvt.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$(openssl base64 -A -in jwt-pub.pem)" >> "$GITHUB_ENV"
          rm jwt-pvt.pem jwt-pub.pem

      - name: Lint (biome)
        run: yarn check

      - name: Typecheck
        run: yarn typecheck

      - name: Migrate and seed
        run: |
          npx tsx src/database/migrate.ts latest
          npx tsx src/database/seed-acl.ts
          npx tsx src/database/seed-admin.ts

      - name: Test
        run: yarn test

  docker:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
